name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact package.json version to release (for example 1.4.324)'
        required: true
        type: string
      publish:
        description: 'Publish to npm after validation (requires the npm trusted publisher binding)'
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPECTED_VERSION: ${{ inputs.version }}
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      OPENUI_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
      - name: Verify release identity
        run: |
          test "$GITHUB_REF" = refs/heads/master
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          if (!/^\d+\.\d+\.\d+$/.test(process.env.EXPECTED_VERSION)
            || pkg.name !== 'termdock' || pkg.version !== process.env.EXPECTED_VERSION
            || lock.version !== pkg.version || lock.packages[''].version !== pkg.version) {
            throw new Error('Requested release must match the committed termdock package and lockfile');
          }
          JS
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install tmux for integration checks
        run: |
          if ! command -v tmux >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends tmux
          fi
      - run: npm ci
      - name: Verify terminal copy and encrypted transport
        run: >-
          npx vitest run --maxWorkers=2
          src/lib/federation
          src/lib/components/chat
          src/components/services
          src/components/FederationAccess.test.tsx
          src/components/ShareResourceFields.test.tsx
          src/lib/services
          src/lib/zIndexTokens.test.ts
          src/server/federation
          src/server/android/adb.test.ts
          src/server/android/scrcpyForward.test.ts
          src/server/android/recordingTransport.test.ts
          src/server/android/recording.test.ts
          src/server/agent/sessionAttachmentRoutes.test.ts
          src/server/agent/sessionChatRoutes.test.ts
          src/server/agent/collaborationCli.test.ts
          src/server/agent/collaborationPrompt.test.ts
          src/server/shared/sessionAppearance.test.ts
          src/server/agent/sessionViewModeRoutes.test.ts
          src/server/routes/sharedFiles.test.ts
          src/server/routes/vncReadOnly.test.ts
          src/lib/android/deviceOptions.test.ts
          src/lib/android/sharedDeviceOptions.test.ts
          src/server/android/liveBitrateTransport.test.ts
          src/server/android/liveBitrate.test.ts
          src/server/utils/tmuxCopySelection.test.ts
          src/server/utils/tmuxSizeOwnership.test.ts
          src/server/utils/tmuxClientCapabilities.test.ts
          src/server/utils/nodePtyCleanup.test.ts
          src/lib/terminal/clipboardText.test.ts
          src/lib/terminal/nativeWebLinks.test.ts
          src/lib/terminal/wrappedWebLinks.test.ts
          src/lib/terminal/osc52Clipboard.test.ts
          src/lib/components/terminal/TerminalViewportPasteOwnership.test.tsx
          src/lib/federation/SecureAccessGate.test.tsx
          src/lib/terminal/api.close.test.ts
          src/lib/desktop/encryptedFileDrops.test.ts
          src/lib/components/terminal/TerminalFileDropStatus.test.tsx
          src/server/agent/integrationBatchRelease.test.ts
          src/server/agent/integration.test.ts
          src/server/agent/collaborationNoop.test.ts
          src/server/agent/collaborationStore.test.ts
          src/server/agent/integrationObservation.test.ts
          src/server/agent/integrationTmuxObservation.test.ts
          src/server/agent/integrationPersistence.test.ts
          src/server/agent/integrationDetachedClose.test.ts
          src/server/agent/sessionManagement.test.ts
          src/server/utils/tmuxLayoutReader.test.ts
          src/server/agent/integrationRecoveryBinding.test.ts
          src/server/agent/sessionLifecycle.test.ts
          src/server/agent/sessionLaunchState.test.ts
          src/server/agent/sessionStateReload.test.ts
          src/server/agent/integrationShellWait.test.ts
          src/server/agent/integrationProfileIdentity.test.ts
          src/server/agent/nativeProcessIdentity.test.ts
          src/server/utils/hostResources.test.ts
          src/server/utils/tmuxRecoveryOperations.test.ts
          src/server/utils/tmuxRecovery.test.ts
          src/server/utils/tmuxRecoveryDismissal.test.ts
          src/server/routes/terminalRecovery.test.ts
          src/lib/components/computer/ComputerControlView.test.tsx
          src/lib/computer/rdpSession.test.ts
      - name: Verify desktop bridge file-drop transport and lifecycle
        run: node --test desktop-rust/renderer/bridge.test.mjs
      - name: Verify npm publication status handling
        run: node --test tests/verifyNpmPublication.test.mjs
      - name: Verify installation and initialization failure matrix
        run: npm run test:initialization
      - name: Verify systemd runtime isolation policy
        run: node --test tests/systemdKillMode.test.mjs
      - run: npm run build
      - name: Pack the verified build
        run: |
          mkdir -p "$RUNNER_TEMP/npm-package"
          npm pack --json --pack-destination "$RUNNER_TEMP/npm-package" > "$RUNNER_TEMP/npm-package/pack.json"
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package-${{ inputs.version }}
          path: ${{ runner.temp }}/npm-package/
          if-no-files-found: error
          retention-days: 7

  publish:
    if: ${{ inputs.publish }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      EXPECTED_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11
      - uses: actions/download-artifact@v4
        with:
          name: npm-package-${{ inputs.version }}
          path: npm-package
      - name: Verify the package transferred from the build job
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const [pack] = JSON.parse(fs.readFileSync('npm-package/pack.json', 'utf8'));
          if (pack.name !== 'termdock' || pack.version !== process.env.EXPECTED_VERSION
            || pack.filename !== `termdock-${pack.version}.tgz`) throw new Error('Unexpected release package');
          const bytes = fs.readFileSync(`npm-package/${pack.filename}`);
          const integrity = `sha512-${crypto.createHash('sha512').update(bytes).digest('base64')}`;
          if (integrity !== pack.integrity || bytes.length !== pack.size) throw new Error('Release package integrity mismatch');
          JS
      - name: Publish the verified package using OIDC
        run: npm publish "./npm-package/termdock-${EXPECTED_VERSION}.tgz" --access public
      - name: Verify the registry package and latest tag
        id: registry
        run: node .github/scripts/verify-npm-publication.mjs npm-package/pack.json --upload-accepted
