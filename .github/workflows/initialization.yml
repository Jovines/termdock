name: Verify initialization

on:
  push:
    branches: [master]
    paths:
      - 'src/server/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package*.json'
      - '.github/workflows/initialization.yml'
  pull_request:
    paths:
      - 'src/server/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package*.json'
      - '.github/workflows/initialization.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: initialization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  initialization:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      OPENUI_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci
      - name: Verify mocked failures and isolated CLI startup
        run: npm run test:initialization
      - name: Verify official download, real certificates and HTTPS without changing system trust
        run: npm run test:initialization:real
