[package]
name = "termdock-native-terminal"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Pinned Ghostty external-backend surface with bounded Rust transport"

[features]
# Linux CI typechecks the Rust host API; does not supply AppKit symbols.
check-native-api = []

[lib]
name = "termdock_native_terminal"

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
serde_json = "1"

[build-dependencies]
cc = "1"

[workspace]

[dev-dependencies]
