[package]
name = "termdock-preview"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"

[lib]
name = "termdock_preview"

[[bin]]
name = "termdock-preview"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:arboard", "dep:rfd", "dep:png", "dep:open", "dep:tauri-plugin-updater", "dep:minisign-verify"]

[build-dependencies]
png = "0.17"
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
termdock-native-terminal = { path = "../native-terminal" }
tauri = { version = "=2.12.3", features = ["tray-icon", "macos-private-api"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
arboard = { version = "3", optional = true }
rfd = { version = "0.15", optional = true }
png = { version = "0.17", optional = true }
open = { version = "5", optional = true }
tauri-plugin-updater = { version = "2", optional = true }
minisign-verify = { version = "0.3", optional = true }
bs58 = "0.5"
flate2 = "1"
tar = "0.4"
plist = "1"
rustls-native-certs = "0.8"
tokio-rustls = "0.26"
libc = "0.2"
tempfile = "3"

[dev-dependencies]
tauri = { version = "=2.12.3", default-features = false, features = ["test"] }
png = "0.17"
rcgen = "0.14"
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSPasteboard", "NSPasteboardItem"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray"] }
